<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初始化 · Market Dashboard</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">MARKET DASHBOARD · FIRST USE</p>
    <h1>初始化管理员</h1>
    <p id="setupHint">欢迎使用。创建唯一的管理员账号后即可进入看板。</p>
    <form id="setupForm">
      <label>管理员账号<input id="setupUsername" name="setupUsername" autocomplete="username" required value="admin" maxlength="64"></label>
      <label>密码<input id="setupPassword" name="setupPassword" type="password" autocomplete="new-password" required minlength="12"></label>
      <label>确认密码<input id="setupPasswordConfirm" name="setupPasswordConfirm" type="password" autocomplete="new-password" required minlength="12"></label>
      <p class="form-help">密码至少 12 位。创建后会自动登录。</p>
      <button type="submit">创建管理员并进入看板</button>
    </form>
    <p id="setupError" role="alert"></p>
    <p class="recovery">请在把服务暴露到不受信任的网络前完成此步骤；第一个成功注册的账号即为管理员。</p>
  </main>
  <script src="setup.js"></script>
</body>
</html>
