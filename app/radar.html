<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script defer src="/assets/workspace-nav.js"></script>
<title>机会雷达</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="workspace-theme.css">
<link rel="stylesheet" href="radar.css">
</head>
<body class="workspace-app radar-workspace">
<header class="workspace-header">
  <h1><a href="/" aria-label="Market Dashboard 首页">Market Dashboard</a></h1>
  <div class="header-status-area workspace-header-status">
    <span class="hint" id="status">加载中...</span>
  </div>
</header>

<main class="radar-wrap">
  <section class="radar-layout">
    <div class="panel dossier-list-panel">
      <div class="panel-head">
        <h2 id="panelTitle">机会候选池</h2>
        <span id="panelHint" class="hint"></span>
      </div>
      <details class="lf-review" data-review="radar">
        <summary>自选外发现 · 30 天复盘</summary>
      </details>
      <script defer src="/assets/low-frequency-review.js"></script>
      <div class="radar-tabs" role="tablist">
        <button class="radar-tab active" type="button" data-tab="queue" role="tab" aria-selected="true">机会候选池</button>
        <button class="radar-tab" type="button" data-tab="archive" role="tab" aria-selected="false">档案库</button>
        <button class="radar-tab" type="button" data-tab="dismissed" role="tab" aria-selected="false">已隐藏</button>
      </div>

      <div class="toolbar">
        <div id="marketFilterButtons" class="market-filter-buttons" role="group" aria-label="市场筛选">
          <button class="market-btn active" type="button" data-market="">全部</button>
          <button class="market-btn" type="button" data-market="US">美股</button>
          <button class="market-btn" type="button" data-market="HK">港股</button>
          <button class="market-btn" type="button" data-market="CN" hidden>A 股</button>
        </div>
        <span class="toolbar-spacer"></span>
        <input aria-label="搜索代码或名称" id="dossierSearch" class="dossier-search" placeholder="搜索代码或名称" type="search">
        <span id="dossierCount" class="hint"></span>
      </div>
      <div id="dossierList" class="dossier-list">
        <div class="dossier-empty">正在加载...</div>
      </div>
      <div id="listStatus" class="status-line"></div>
    </div>

    <aside class="panel dossier-detail-panel">
      <div class="panel-head">
        <h2>标的研究档案</h2>
        <button type="button" id="backToCandidates" class="btn ghost">返回列表</button>
        <span id="detailHint" class="hint"></span>
      </div>
      <div id="dossierDetail" class="dossier-detail dossier-detail-empty">
        选择候选标的查看档案。
      </div>
    </aside>
  </section>
</main>


<script defer src="dashboard-shared.js"></script>
<script type="module" src="radar.js"></script>
</body>
</html>
