<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市场工作台 · Market Dashboard</title>
  <link rel="stylesheet" href="/workspace-theme.css">
  <link rel="stylesheet" href="/land.css">
  <script defer src="/assets/workspace-nav.js"></script>
</head>
<body class="workspace-app land-workspace">
<header class="workspace-header">
  <h1><a href="/" aria-label="Market Dashboard 首页">Market Dashboard</a></h1>
</header>
<main class="land-main">
  <header class="overview-title"><div><p id="overviewDate"></p><h2>市场总览</h2></div><button type="button" class="btn ghost" id="overviewRefresh">刷新行情</button></header>
  <div class="overview-grid">
    <section class="index-monitor" aria-labelledby="indexTitle">
      <div class="monitor-heading"><h3 id="indexTitle">全球指数</h3><small>分时优先 · 日线备用</small></div>
      <div id="indexChooser" class="index-chooser" aria-label="选择指数"></div>
      <div id="indexReadout" class="index-readout" aria-live="polite">正在读取指数…</div>
      <div id="indexPlot" class="index-plot"></div>
    </section>
    <section class="movement-panel" aria-labelledby="movementTitle">
      <div class="monitor-heading"><h3 id="movementTitle">自选股涨跌榜</h3><a href="/stock">全部自选 →</a></div>
      <div class="board-segment" role="group" aria-label="排行顺序"><button type="button" data-order="down" aria-pressed="true">跌幅优先</button><button type="button" data-order="up" aria-pressed="false">涨幅优先</button></div>
      <div id="watchBreadth" class="watch-breadth"></div>
      <div id="movementList" aria-live="polite">正在读取自选行情…</div>
      <small id="marketStamp"></small>
    </section>
  </div>
  <section class="next-actions"><h3>研究入口</h3><div>
    <a href="/radar"><strong>机会候选池</strong><span>按入池依据比较标的</span></a>
    <a href="/assets/rsi6.html"><strong>超卖扫描</strong><span>从触发记录查标的档案</span></a>
    <a href="/lab"><strong>实验账本</strong><span>从样本分组查冻结记录</span></a>
  </div></section>
</main>
<script type="module">
const byId = id => document.getElementById(id);
let indices = [], quotes = [], selected = '', order = 'down';
const format = n => n.toLocaleString('zh-CN',{maximumFractionDigits:2,minimumFractionDigits:2});
const pct = n => (n>0?'+':'') + n.toFixed(2) + '%';
function add(parent, tag, text) {
  const el = document.createElement(tag);
  el.textContent = text;
  parent.append(el);
  return el;
}
function drawIndex() {
  const item = indices.find(row => row.label === selected) || indices[0];
  const head = byId('indexReadout'), plot = byId('indexPlot');
  head.replaceChildren(); plot.replaceChildren();
  if (!item) { head.textContent = '暂无指数行情'; return; }
  selected = item.label;
  for (const button of byId('indexChooser').children) button.setAttribute('aria-pressed',String(button.textContent === selected));
  add(head,'small',item.label);
  add(head,'strong',Number.isFinite(item.price)?format(item.price):'—');
  if (Number.isFinite(item.changePct)) add(head,'span',pct(item.changePct));
  const pts = (item.points || []).filter(Number.isFinite);
  if (pts.length < 2) { plot.textContent = '暂无走势数据'; return; }
  const lo=Math.min(...pts), hi=Math.max(...pts);
  const line = pts.map((v,i) => (i?'L':'M')+(i*600/(pts.length-1)).toFixed(2)+' '+(128-(v-lo)/(hi-lo||1)*116).toFixed(2)).join(' ');
  plot.innerHTML = '<svg viewBox="0 0 600 142" preserveAspectRatio="none" role="img" aria-label="所选指数近期走势"><path d="'+line+' L600 142H0Z" fill="rgba(174,176,255,.17)"/><path d="'+line+'" vector-effect="non-scaling-stroke" fill="none" stroke="#c3c5ff" stroke-width="3"/></svg>';
  const scale=add(plot,'div','');scale.className='chart-range';
  add(scale,'span','区间低点 '+format(lo));add(scale,'span','区间高点 '+format(hi));
}
function drawQuotes() {
  const root=byId('movementList');root.replaceChildren();
  const breadth=byId('watchBreadth');breadth.replaceChildren();
  if (quotes.length) {
    const up = quotes.filter(q => q.changePct > 0).length, down = quotes.filter(q => q.changePct < 0).length;
    add(breadth,'div','上涨 '+up+' · 平盘 '+(quotes.length-up-down)+' · 下跌 '+down);
    const bar = add(breadth,'div','');bar.className='breadth-bar';bar.setAttribute('aria-hidden','true');
    for (const [tone,count] of [['up',up],['flat',quotes.length-up-down],['down',down]]) {
      if (count) { const piece = add(bar,'i','');piece.className=tone;piece.style.flexGrow=count; }
    }
  }
  for (const row of [...quotes].sort((a,b)=>order==='up'?b.changePct-a.changePct:a.changePct-b.changePct).slice(0,5)) {
    const link=add(root,'a','');link.href='/stock?symbol='+encodeURIComponent(row.symbol);
    const name=add(link,'div','');add(name,'strong',row.name||row.symbol);add(name,'small',row.symbol);
    const change=add(link,'b',pct(row.changePct));change.className=row.changePct<0?'loss':'gain';
  }
  if (!quotes.length) root.textContent='暂无带涨跌幅的自选行情';
}
for (const button of document.querySelectorAll('[data-order]')) button.onclick=()=>{
  order=button.dataset.order;document.querySelectorAll('[data-order]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));drawQuotes();
};
async function get(path) {
  const r=await fetch(path,{cache:'no-store',signal:AbortSignal.timeout(20000)});
  if(!r.ok) throw Error(String(r.status));
  return r.json();
}
async function refresh() {
  const refreshButton=byId('overviewRefresh');refreshButton.disabled=true;
  await Promise.allSettled([
    get('/market/index-bar').then(data=>{
      indices=data.items || [];const choices=byId('indexChooser');choices.replaceChildren();
      for(const row of indices){const b=add(choices,'button',row.label);b.type='button';b.onclick=()=>{selected=row.label;drawIndex();};}
      drawIndex();
    }).catch(()=>{drawIndex();byId('indexReadout').append(' · 本次读取失败，可刷新重试');}),
    Promise.all([get('/stock-snapshot'),get('/stock-watchlist')]).then(([raw,list])=>{
      quotes=list.flatMap(w=>Number.isFinite(raw[w.symbol]?.changePct)?[{...raw[w.symbol],symbol:w.symbol}]:[]);
      drawQuotes();byId('marketStamp').textContent=Number.isFinite(raw.ts)?'行情快照 '+new Date(raw.ts).toLocaleString('zh-CN',{hour12:false}):'';
    }).catch(()=>{if(!quotes.length) byId('movementList').textContent='自选行情读取失败，可刷新重试';byId('marketStamp').textContent='本次刷新未完成';})
  ]);
  refreshButton.disabled=false;
}
byId('overviewDate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
byId('overviewRefresh').onclick=refresh;refresh();
</script>
</body>
</html>
