<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机会雷达</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="workspace-theme.css">
<link rel="stylesheet" href="radar-v2.css">
</head>
<body class="workspace-app radar-v2-workspace">
<header>
  <h1><a href="/">Market Dashboard</a></h1>
  <nav>
    <a href="/stock">股票监控</a>
    <a href="/tracker">杠杆 ETF 追踪</a>
    <a href="/radar-v2" class="ac">机会雷达</a>
    <a href="/lab">实验室</a>
    <a href="/control">控制中心</a>
  </nav>
  <div class="header-status-area workspace-header-status">
    <span class="hint" id="status">加载中...</span>
  </div>
</header>

<main class="radar-v2-wrap">
  <div class="radar-v2-tabs" role="tablist">
    <button class="radar-v2-tab active" type="button" data-tab="queue" role="tab">机会候选池</button>
    <button class="radar-v2-tab" type="button" data-tab="archive" role="tab">档案库</button>
    <button class="radar-v2-tab" type="button" data-tab="dismissed" role="tab">已隐藏</button>
  </div>

  <div class="toolbar">
    <div id="marketFilterButtons" class="market-filter-buttons" role="group" aria-label="市场筛选">
      <button class="market-btn active" type="button" data-market="">全部</button>
      <button class="market-btn" type="button" data-market="US">美股</button>
      <button class="market-btn" type="button" data-market="HK">港股</button>
      <button class="market-btn" type="button" data-market="CN">A 股</button>
    </div>
    <span class="toolbar-spacer"></span>
    <input id="dossierSearch" class="dossier-search" placeholder="搜索代码或名称" type="search">
    <span id="dossierCount" class="hint"></span>
  </div>

  <section class="radar-v2-layout">
    <div class="panel dossier-list-panel">
      <div class="panel-head">
        <h2 id="panelTitle">机会候选池</h2>
        <span id="panelHint" class="hint"></span>
      </div>
      <div id="dossierList" class="dossier-list">
        <div class="dossier-empty">正在加载...</div>
      </div>
      <div id="listStatus" class="status-line"></div>
    </div>

    <aside class="panel dossier-detail-panel">
      <div class="panel-head">
        <h2>详情</h2>
        <span id="detailHint" class="hint"></span>
      </div>
      <div id="dossierDetail" class="dossier-detail dossier-detail-empty">
        选择左侧条目查看详情。
      </div>
    </aside>
  </section>
</main>

<script defer src="vendor/echarts.min.js"></script>
<script defer src="dashboard-shared.js"></script>
<script type="module" src="radar-v2.js"></script>
</body>
</html>
